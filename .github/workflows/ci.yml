name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar
        run: pip install -e ".[dev]"
      - name: Herramientas de Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y smartmontools pciutils mesa-vulkan-drivers libvulkan1   # Vulkan por software para la prueba de GPU
      - name: Tests
        run: pytest -v
      - name: Diagnóstico corto en la máquina real
        shell: bash
        env:
          OPENSTD_DATOS: ${{ runner.temp }}/openstd
        run: |
          python -m openstd info
          python -m openstd diagnosticar --pruebas sistema,cpu,ram --minutos-cpu 0.2 --minutos-ram 0.2 --sin-correo --json || test $? -eq 1
